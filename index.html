<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Bee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff; /* Clean white background */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Custom animation for the button to make it engaging */
        @keyframes pulse-shadow {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.2);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(0, 0, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
            }
        }

        .action-button {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            animation: pulse-shadow 1.5s infinite;
        }
        
        .action-button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <main class="text-center px-4">
        
        <!-- Main Heading -->
        <h1 class="text-5xl md:text-7xl font-black text-black mb-8 tracking-tight">
            Study Bee
        </h1>

        <!-- Call to Action Button wrapped in an anchor tag for redirection -->
        <a href="https://studybeepro.site" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="inline-block no-underline">
            
            <button class="action-button bg-[#111111] text-white font-bold py-3 px-8 rounded-xl text-lg md:text-xl flex items-center justify-center gap-2 mx-auto">
                <span>🔥</span>
                <span>Open Now</span>
                <span>🔥</span>
            </button>
            
        </a>

    </main>

    <!-- Optional: Minimal footer to keep it looking like a complete page -->
    <footer class="absolute bottom-4 w-full text-center text-gray-400 text-sm">
        <p>&copy; 2026 Study Bee. All rights reserved.</p>
    </footer>
</body>
</html>
